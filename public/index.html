function uid(){ return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6); }

let currentUid = null;
let unsubJobs = null, unsubApps = null, unsubNotifs = null, unsubProfile = null;
let seedAttempted = false;

let state = {
  screen: 'loading',      // loading | onboard | register | login | home | activity | profile | postJob | notifications
  role: null,             // 'worker' | 'business'
  profile: {},
  jobs: [],
  applications: [],
  notifications: [],
  search: "",
  filterCat: null,
  filterCity: null,
  filterDay: null,
  filterLetter: null,
  sort: "kohe",
  activeJobId: null,
  authError: ""
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ---------------------------------------------------------------- */
/* AUTH BOOTSTRAP                                                     */
/* ---------------------------------------------------------------- */
onAuthStateChanged(auth, async (user) => {
  detachListeners();
  if(!user){
    currentUid = null;
    state.role = null; state.profile = {};
    state.screen = state.screen==='login' ? 'login' : 'onboard';
    render();
    return;
  }
  currentUid = user.uid;
  try{
    const snap = await getDoc(doc(db,'users',currentUid));
    if(!snap.exists()){
      // shouldn't normally happen, but guard: send back to registration
      state.screen = 'onboard';
      render();
      return;
    }
    const data = snap.data();
    state.role = data.role;
    state.profile = data;
    state.screen = 'home';
    render();
    attachListeners();
  }catch(e){
    toast('Gabim në lidhjen me serverin: '+e.message);
    state.screen = 'onboard';
    render();
  }
});

function detachListeners(){
  if(unsubJobs){ unsubJobs(); unsubJobs=null; }
  if(unsubApps){ unsubApps(); unsubApps=null; }
  if(unsubNotifs){ unsubNotifs(); unsubNotifs=null; }
  if(unsubProfile){ unsubProfile(); unsubProfile=null; }
}

function attachListeners(){
  // Jobs are the public marketplace — everyone reads the same set, capped for cost/performance.
  unsubJobs = onSnapshot(query(collection(db,'jobs'), orderBy('createdAt','desc'), limit(500)), (snap) => {
    const jobs = [];
    snap.forEach(d => jobs.push({id:d.id, ...d.data()}));
    state.jobs = jobs;
    if(jobs.length===0 && !seedAttempted){
      seedAttempted = true;
      seedJobsOnce();
    }
    if(['home','activity'].includes(state.screen)) render();
  }, (err)=> toast('Gabim leximi punësh: '+err.message));

  // Applications contain other people's names/emails — only fetch the ones this
  // account is actually a party to (as the worker, or as the hiring business).
  const appsQuery = state.role === 'business'
    ? query(collection(db,'applications'), where('businessUid','==',currentUid))
    : query(collection(db,'applications'), where('workerUid','==',currentUid));
  unsubApps = onSnapshot(appsQuery, (snap) => {
    const apps = [];
    snap.forEach(d => apps.push({id:d.id, ...d.data()}));
    state.applications = apps;
    if(state.screen==='activity') render();
  }, (err)=> toast('Gabim leximi aplikimesh: '+err.message));

  unsubNotifs = onSnapshot(
    query(collection(db,'users',currentUid,'notifications'), orderBy('createdAt','desc'), limit(100)),
    (snap) => {
      const notifs = [];
      snap.forEach(d => notifs.push({id:d.id, ...d.data()}));
      state.notifications = notifs;
      render();
    }, (err)=> toast('Gabim leximi njoftimesh: '+err.message)
  );

  unsubProfile = onSnapshot(doc(db,'users',currentUid), (d) => {
    if(d.exists()){
      state.profile = d.data();
      state.role = state.profile.role;
      if(state.screen==='profile' || state.screen==='postJob') render();
    }
  });
}

// Seeds the demo jobs exactly once, ever, using a transaction on a marker
// document so two clients that both see an empty list at the same moment
// can't both seed (which previously produced duplicate listings).
async function seedJobsOnce(){
  try{
    const seedRef = doc(db,'meta','seedStatus');
    let shouldSeed = false;
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(seedRef);
      if(!snap.exists()){
        tx.set(seedRef, { seededAt: Date.now(), seededBy: currentUid });
        shouldSeed = true;
      }
    });
    if(!shouldSeed) return;
    for(const j of SEED_JOBS){
      const id = uid();
      await setDoc(doc(db,'jobs',id), {
        ...j, postedByUid: currentUid, postedByName: j.company,
        isSeed: true, status: 'open', createdAt: Date.now()
      });
    }
  }catch(e){ /* silent — seeding is a convenience, not critical */ }
}

function letterCounts(){
  const counts = {};
  LETTERS.forEach(l => counts[l]=0);
  state.jobs.forEach(j => {
    const l = (j.title[0]||"").toUpperCase();
    if(counts[l]!==undefined) counts[l]++;
  });
  return counts;
}

function filteredJobs(){
  let list = state.jobs.filter(j => j.status !== 'closed');
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(j => j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || CATS[j.cat].label.toLowerCase().includes(q));
  }
  if(state.filterLetter) list = list.filter(j => (j.title[0]||"").toUpperCase()===state.filterLetter);
  if(state.filterCat) list = list.filter(j => j.cat===state.filterCat);
  if(state.filterCity) list = list.filter(j => j.city===state.filterCity);
  if(state.filterDay) list = list.filter(j => j.day===state.filterDay);
  if(state.sort==='paga') list.sort((a,b)=> b.pay-a.pay);
  else if(state.sort==='vende') list.sort((a,b)=> (b.people-b.filled)-(a.people-a.filled));
  return list;
}

function myApplications(){
  return state.applications.filter(a => a.workerUid === currentUid);
}
function myPostedJobs(){
  return state.jobs.filter(j => j.postedByUid === currentUid);
}

/* ---- reliability score & badges (Wonolo Score / Instawork Top Pro style) ---- */
function computeScore(p){
  const base = 5 - (p.cancellations||0)*0.4;
  return Math.max(1, Math.min(5, base)).toFixed(1);
}
function getBadge(p){
  const shifts = p.completedShifts||0;
  const score = parseFloat(computeScore(p));
  if(shifts===0) return {label:'Profil i ri', cls:''};
  if(shifts>=5 && score>=4.5) return {label:'⭐ Punëtor i Besuar', cls:'top'};
  if(score<3) return {label:'Besueshmëri e ulët', cls:''};
  return {label:'Aktiv', cls:''};
}

async function forgotPassword(){
  const field = document.getElementById('lg_email');
  const email = (field ? field.value.trim() : '') || prompt('Shkruaj email-in tënd:');
  if(!email) return;
  try{
    await sendPasswordResetEmail(auth, email);
    toast('U dërgua një email për rivendosjen e fjalëkalimit ✓');
  }catch(e){ toast('Gabim: '+friendlyAuthError(e.code)); }
}

async function doLogin(){
  const email = document.getElementById('lg_email').value.trim();
  const pass = document.getElementById('lg_pass').value;
  if(!email || !pass){ toast('Plotëso email-in dhe fjalëkalimin'); return; }
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    state.authError = '';
  }catch(e){
    state.authError = friendlyAuthError(e.code);
    render();
  }
}

function friendlyAuthError(code){
  const map = {
    'auth/invalid-email':'Email jo i vlefshëm.',
    'auth/user-not-found':'S\'ka llogari me këtë email.',
    'auth/wrong-password':'Fjalëkalim i gabuar.',
    'auth/invalid-credential':'Email ose fjalëkalim i gabuar.',
    'auth/email-already-in-use':'Ky email është regjistruar tashmë. Provo të kyçesh.',
    'auth/weak-password':'Fjalëkalimi duhet të ketë të paktën 6 shkronja/shifra.',
    'auth/too-many-requests':'Shumë përpjekje — provo përsëri pas pak.'
  };
  return map[code] || ('Gabim: '+code);
}

async function completeRegister(){
  const p = state.profile;
  p.firstName = document.getElementById('rg_first').value.trim();
  p.lastName = document.getElementById('rg_last').value.trim();
  p.email = document.getElementById('rg_email').value.trim();
  const pass = document.getElementById('rg_pass').value;
  p.phone = document.getElementById('rg_phone').value.trim();
  if(state.role==='business'){
    p.bizName = document.getElementById('rg_biz').value.trim();
    p.nipt = document.getElementById('rg_nipt').value.trim();
  }
  if(!p.firstName || !p.lastName || !p.email || !p.phone){
    toast('Plotëso emrin, mbiemrin, email-in dhe telefonin'); return;
  }
  if(!pass || pass.length<6){
    toast('Fjalëkalimi duhet të ketë të paktën 6 shkronja/shifra'); return;
  }
  if(state.role==='business' && (!p.bizName || !p.nipt)){
    toast('Plotëso emrin e biznesit dhe NIPT-in'); return;
  }
  try{
    const cred = await createUserWithEmailAndPassword(auth, p.email, pass);
    const profileDoc = {
      role: state.role,
      firstName: p.firstName, lastName: p.lastName, email: p.email, phone: p.phone,
      bizName: p.bizName||null, nipt: p.nipt||null,
      cardLast4: p.cardLast4||null, cardToken: p.cardToken||null, cardBrand: p.cardBrand||null,
      wallet: 0, completedShifts: 0, cancellations: 0,
      createdAt: Date.now()
    };
    await setDoc(doc(db,'users',cred.user.uid), profileDoc);
    state.authError = '';
    toast('Llogaria u krijua ✓');
    // onAuthStateChanged will take over navigation to 'home'
  }catch(e){
    state.authError = friendlyAuthError(e.code);
    render();
  }
}

  return '';
}

function renderNav(){
  const items = state.role==='business'
    ? [['home','🏠','Kërko'],['postJob','➕','Posto'],['activity','📋','Aplikantë'],['profile','👤','Profili']]
    : [['home','🏠','Kërko'],['activity','📋','Aktiviteti'],['profile','👤','Profili']];
  return `<div class="navbar">
    ${items.map(([id,ic,label]) => `<button class="nav-btn ${state.screen===id?'active':''}" onclick="goto('${id}')"><span class="ic">${ic}</span>${label}</button>`).join('')}

}

function renderHome(){
  const list = filteredJobs();
  if(list.length===0){
    return `<div class="empty"><div class="big">🗂️</div>Nuk u gjet asnjë punë me këto filtra.<br>Provo të pastrosh kërkimin ose kthehu më vonë.</div>`;

function renderJobCard(j){

  const left = j.people - j.filled;

  <div class="job-card" style="--cat:${cat.color}" onclick="openJob('${j.id}')">
    <div class="job-main">
      <div class="job-top">
        <div>

          <div class="job-sub">${escapeHtml(j.company)} · ${j.city}</div>

      </div>

        <span class="tag" style="color:${cat.color}">${cat.label}</span>
        <span class="tag day">${j.day==='sot'?'Sot':j.day==='nesër'?'Nesër':'Këtë javë'}</span>
        <span class="tag">${j.hours} orë</span>
        <span class="tag people">${left>0? left+' vende bosh' : 'Plot'}</span>

const STATUS_LABEL = {
  pending:{cls:'status-pending', lbl:'Në shqyrtim'},
  pranuar:{cls:'status-accepted', lbl:'Rezervuar'},
  ne_progres:{cls:'status-accepted', lbl:'Në turn'},
  completed:{cls:'status-accepted', lbl:'Përfunduar'},
  refuzuar:{cls:'status-rejected', lbl:'Refuzuar'},
  anulluar:{cls:'status-rejected', lbl:'Anulluar'}
};

function renderActivity(){
  if(state.role==='business'){
    const jobs = myPostedJobs();
    if(jobs.length===0) return `<div class="empty"><div class="big">📋</div>Nuk ke postuar ende asnjë punë.<br>Shko te "Posto" për ta krijuar të parën.</div>`;
    return `<div class="section-label">Punët e tua (${jobs.length})</div>` + jobs.map(j => {
      const apps = state.applications.filter(a => a.jobId===j.id);
      const closed = j.status === 'closed';
      return `<div class="app-card">
        <div class="top"><div class="jt">${escapeHtml(j.title)}</div><span class="tag" style="color:${CATS[j.cat].color}">${closed ? 'Mbyllur' : CATS[j.cat].label}</span></div>
        <div class="meta">${j.city} · ${j.filled}/${j.people} vende të plotësuara</div>
        ${!closed ? `<div class="action-row"><button class="btn btn-danger btn-sm" onclick="cancelJobPosting('${j.id}')">Mbyll postimin</button></div>` : ''}
        ${apps.length===0 ? `<div class="meta" style="margin-top:6px;">Ende pa aplikime</div>` : apps.slice().reverse().map(a => renderApplicantRow(a)).join('')}
      </div>`;
    }).join('');
  }
  const apps = myApplications();
  if(apps.length===0) return `<div class="empty"><div class="big">📭</div>Nuk ke aplikuar për asnjë punë ende.<br>Shfleto listën dhe apliko me një prekje.</div>`;
  return `<div class="section-label">Aplikimet e tua (${apps.length})</div>` + apps.slice().reverse().map(a => renderMyApplicationCard(a)).join('');
}

function renderApplicantRow(a){
  const st = STATUS_LABEL[a.status] || STATUS_LABEL.pending;
  const badgeCls = a.workerScoreSnapshot>=4.5 ? 'top' : '';
  return `
  <div style="border-top:1px solid var(--line); padding-top:10px; margin-top:10px;">
    <div class="top" style="margin-bottom:6px;">
      <div><div style="font-weight:700;font-size:13.5px;">${escapeHtml(a.workerName||'Punëtor')}</div>
      <span class="score-badge ${badgeCls}" style="margin-top:4px;">⭐ ${a.workerScoreSnapshot||'—'} · ${escapeHtml(a.workerBadgeSnapshot||'Profil i ri')}</span></div>
      <span class="status-pill ${st.cls}">${st.lbl}</span>
    </div>
    ${a.status==='pending' ? `
      <div class="action-row">
        <button class="btn btn-primary btn-sm" onclick="businessRespond('${a.id}','pranuar')">Prano</button>
        <button class="btn btn-ghost btn-sm" onclick="businessRespond('${a.id}','refuzuar')">Refuzo</button>
      </div>` : ''}
    ${a.status==='completed' && !a.businessRatingGiven ? `
      <div style="font-size:12px;color:var(--text-mute);margin-top:6px;">Vlerëso punëtorin:</div>
      <div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="rateWorker('${a.id}',${n})">${n}★</button>`).join('')}</div>
    ` : a.businessRatingGiven ? `<div style="font-size:12px;color:var(--text-mute);margin-top:6px;">Vlerësuar prej teje: ${a.businessRatingGiven}★</div>` : ''}
  </div>`;
}

function renderMyApplicationCard(a){
  const job = state.jobs.find(j => j.id===a.jobId);
  if(!job) return '';
  const st = STATUS_LABEL[a.status] || STATUS_LABEL.pending;
  let actions = '';
  if(a.status==='pending'){
    actions = `<div class="action-row"><button class="btn btn-danger btn-sm" onclick="cancelApplication('${a.id}')">Anulo aplikimin</button></div>`;
  } else if(a.status==='pranuar'){
    actions = `<div class="action-row">
      <button class="btn btn-primary btn-sm" onclick="checkIn('${a.id}')">📍 Fillo turnin</button>
      <button class="btn btn-danger btn-sm" onclick="cancelApplication('${a.id}')">Anulo</button>
    </div>`;
  } else if(a.status==='ne_progres'){
    actions = `<div class="action-row"><button class="btn btn-primary btn-sm" onclick="checkOut('${a.id}')">✅ Përfundo turnin</button></div>`;
  } else if(a.status==='completed'){
    if(!a.workerRatingGiven){
      actions = `<div style="font-size:12px;color:var(--text-mute);margin-top:8px;">Vlerëso biznesin:</div>
      <div class="stars">${[1,2,3,4,5].map(n=>`<button onclick="rateBusiness('${a.id}',${n})">${n}★</button>`).join('')}</div>`;
    } else {
      actions = `<div style="font-size:12px;color:var(--teal);margin-top:8px;font-weight:600;">Fitove ${job.pay*job.hours} Lekë · Vlerësove ${a.workerRatingGiven}★</div>`;
    }
  }
  return `<div class="app-card">
    <div class="top"><div class="jt">${escapeHtml(job.title)}</div><span class="status-pill ${st.cls}">${st.lbl}</span></div>
    <div class="meta">${escapeHtml(job.company)} · ${job.city} · ${job.pay}L/orë</div>
    ${actions}
  </div>`;
}

function renderCardBox(p){
  if(p.cardLast4){
    return `
    <div class="secure-box">
      <div class="secure-head"><span class="lock">🔒</span> Kartë e verifikuar <span class="secure-badge">✓ Tokenizuar</span></div>
      <div class="card-visual">
        <div class="row"><span>KARTË BIZNESI</span><span>${p.cardBrand||'VISA'}</span></div>
        <div class="num">•••• •••• •••• ${p.cardLast4}</div>
        <div class="row"><span>${escapeHtml(p.bizName||p.firstName||'BIZNES')}</span><span>Token: ${p.cardToken}</span></div>
      </div>
      <div class="verify-steps">DayJob nuk ruan kurrë numrin e plotë të kartës. Vetëm procesori i pagesave (modalitet <b>TEST</b>) e sheh atë; ne mbajmë vetëm 4 shifrat e fundit dhe një token referimi.</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="resetCard()">Ndrysho kartën</button>
    </div>`;
  }
  return `
  <div class="secure-box">
    <div class="secure-head"><span class="lock">🔒</span> Verifikim kartë krediti <span class="secure-badge">Modalitet TEST</span></div>
    <div class="test-banner">⚠ Demo — asnjë para reale s'lëviz. Përdor numër testimi: 4242 4242 4242 4242</div>
    <div class="field"><label>Numri i kartës</label><input id="cb_num" placeholder="4242 4242 4242 4242" maxlength="19" oninput="formatCardNum(this)"></div>
    <div class="field-row">
      <div class="field"><label>Skadenca</label><input id="cb_exp" placeholder="MM/VV" maxlength="5" oninput="formatExp(this)"></div>
      <div class="field"><label>CVC</label><input id="cb_cvc" placeholder="•••" maxlength="4" inputmode="numeric"></div>
    </div>
    <button class="btn btn-primary" onclick="tokenizeCard()">Verifiko dhe lidh kartën</button>
    <div class="verify-steps" style="margin-top:12px;">
      Kështu funksionon në realitet: <b>1)</b> karta shkon direkt te një procesor i licencuar (p.sh. Stripe), jo te serveri i DayJob · <b>2)</b> ne marrim vetëm një token + 4 shifrat e fundit · <b>3)</b> çdo pagesë verifikohet me 3D Secure nga banka jote.
    </div>
  </div>`;
}
function formatCardNum(input){
  let v = input.value.replace(/\D/g,'').slice(0,16);
  input.value = v.replace(/(\d{4})(?=\d)/g,'$1 ');
}
function formatExp(input){
  let v = input.value.replace(/\D/g,'').slice(0,4);
  if(v.length>=3) v = v.slice(0,2)+'/'+v.slice(2);
  input.value = v;
}
async function tokenizeCard(){
  const num = document.getElementById('cb_num').value.replace(/\D/g,'');
  const exp = document.getElementById('cb_exp').value;
  const cvc = document.getElementById('cb_cvc').value;
  if(num.length<12 || !exp || cvc.length<3){
    toast('Plotëso të gjitha fushat e kartës'); return;
  }
  const last4 = num.slice(-4);
  state.profile.cardLast4 = last4;
  state.profile.cardToken = 'tok_test_'+uid();
  state.profile.cardBrand = num.startsWith('4') ? 'VISA' : num.startsWith('5') ? 'MASTERCARD' : 'KARTË';
  if(currentUid){
    await updateDoc(doc(db,'users',currentUid), {cardLast4:last4, cardToken:state.profile.cardToken, cardBrand:state.profile.cardBrand});
  }
  toast('Karta u verifikua (test mode) ✓');
  render();
}
async function resetCard(){
  delete state.profile.cardLast4; delete state.profile.cardToken; delete state.profile.cardBrand;
  if(currentUid){
    await updateDoc(doc(db,'users',currentUid), {cardLast4:null, cardToken:null, cardBrand:null});
  }
  render();
}

function renderOverlay(){
  if(!state.activeJobId) return `<div class="overlay hidden"></div>`;
  const j = state.jobs.find(x => x.id===state.activeJobId);
  if(!j) return `<div class="overlay hidden"></div>`;
  const cat = CATS[j.cat];
  const already = state.applications.find(a => a.jobId===j.id && a.workerUid===currentUid && !['refuzuar','anulluar'].includes(a.status));
  const left = j.people-j.filled;
  const isOwner = state.role==='business' && j.postedByUid===currentUid;
  return `
  <div class="overlay" onclick="if(event.target===this) closeJob()">
    <div class="sheet" style="position:relative;">

      <div class="row-item"><span class="k">Vende gjithsej</span><span class="v">${j.people}</span></div>
      <div class="row-item" style="border-bottom:none;"><span class="k">Të plotësuara</span><span class="v">${j.filled}</span></div>
      <div style="height:16px"></div>
      ${isOwner
        ? `<div style="color:var(--text-mute);font-size:13px;">Kjo është puna jote e postuar. ${state.applications.filter(a=>a.jobId===j.id).length} aplikim(e) të marra — shiko te "Aplikantë".</div>`
        : state.role==='business'
          ? `<div style="color:var(--text-mute);font-size:13px;">Kalo në një llogari Individi për të aplikuar për punë.</div>`

                already.status==='pranuar' ? '✓ Rezervuar — shko te Aktiviteti' :

                already.status==='completed' ? '✅ Turn i përfunduar' :
                'Ke aplikuar — në shqyrtim'

              ? `<button class="btn btn-ghost" disabled style="opacity:.6;">Nuk ka vende bosh</button>`
              : `<button class="btn btn-primary" onclick="applyToJob('${j.id}')">Apliko tani</button>`
      }
    </div>
  </div>`;
}

/* ACTIONS                                                            */

function goto(screen){
  state.activeJobId = null;
  state.screen = screen;
  render();
}
function onSearch(v){ state.search = v; keepScroll(); renderKeepFocus(); }
function toggleLetter(l){ state.filterLetter = state.filterLetter===l ? null : l; render(); }
function setFilter(key, val){ state[key] = val; render(); }

function openJob(id){ state.activeJobId = id; render(); }
function closeJob(){ state.activeJobId = null; render(); }

function handleFile(input, field){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024){ toast('Foto është shumë e madhe (maksimumi 5MB)'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = e => { state.profile[field] = e.target.result; toast('Karta ID u ngarkua (lokalisht)'); render(); };
  reader.readAsDataURL(file);
}

async function saveProfile(){
  const p = state.profile;
  p.firstName = document.getElementById('pf_first').value.trim();
  p.lastName = document.getElementById('pf_last').value.trim();
  p.phone = document.getElementById('pf_phone').value.trim();
  const patch = {firstName:p.firstName, lastName:p.lastName, phone:p.phone};
  if(state.role==='business'){
    p.bizName = document.getElementById('pf_biz').value.trim();
    p.nipt = document.getElementById('pf_nipt').value.trim();
    patch.bizName = p.bizName; patch.nipt = p.nipt;
  }
  if(!p.firstName){ toast('Plotëso të paktën emrin'); return; }
  try{
    await updateDoc(doc(db,'users',currentUid), patch);
    toast('Profili u ruajt');
  }catch(e){ toast('Gabim: '+e.message); }
  render();
}

async function addNotifFor(targetUid, text){
  try{
    const id = uid();
    await setDoc(doc(db,'users',targetUid,'notifications',id), {text, read:false, createdAt: Date.now(), time:'Tani'});
  }catch(e){ /* best-effort */ }
}

async function applyToJob(jobId){
  const p = state.profile;
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job) return;
  if(job.postedByUid === currentUid){ toast('Nuk mund të aplikosh për punën tënde'); return; }
  const already = state.applications.find(a => a.jobId===jobId && a.workerUid===currentUid && !['refuzuar','anulluar'].includes(a.status));
  if(already){ toast('Ke aplikuar tashmë për këtë punë'); return; }
  const appId = uid();
  try{
    await setDoc(doc(db,'applications',appId), {
      jobId, workerUid: currentUid, workerEmail:p.email,
      workerName:(p.firstName+' '+(p.lastName||'')).trim(),
      workerScoreSnapshot: parseFloat(computeScore(p)),
      workerBadgeSnapshot: getBadge(p).label,
      businessUid: job.postedByUid || null,
      status:'pending', appliedAt: Date.now()
    });
    toast('Aplikimi u dërgua ✓');
    if(job.postedByUid && !job.isSeed){
      addNotifFor(job.postedByUid, `${p.firstName} aplikoi për "${job.title}".`);
    }
    closeJob();
  }catch(e){ toast('Gabim: '+e.message); }
}

async function businessRespond(appId, decision){
  const a = state.applications.find(x=>x.id===appId);
  if(!a) return;
  let jobTitle = '';
  try{
    await runTransaction(db, async (tx) => {
      const appRef = doc(db,'applications',appId);
      const appSnap = await tx.get(appRef);
      if(!appSnap.exists()) throw new Error('Aplikimi nuk ekziston më');
      const appData = appSnap.data();
      if(appData.status !== 'pending') throw new Error('Ky aplikim është përpunuar tashmë nga dikush tjetër');
      const jobRef = doc(db,'jobs', appData.jobId);
      const jobSnap = await tx.get(jobRef);
      const job = jobSnap.exists() ? jobSnap.data() : null;
      jobTitle = job ? job.title : '';
      if(decision === 'pranuar'){
        if(!job) throw new Error('Puna nuk ekziston më');
        // Re-checked INSIDE the transaction so two overlapping accepts can never
        // both succeed and overbook the shift.
        if((job.filled||0) >= job.people) throw new Error('Nuk ka më vende bosh për këtë punë');
        tx.update(jobRef, { filled: (job.filled||0) + 1 });
      }
      tx.update(appRef, { status: decision });
    });
    addNotifFor(a.workerUid, decision==='pranuar' ? `Aplikimi yt për "${jobTitle}" u pranua! 🎉 Rezervuar.` : `Aplikimi yt për "${jobTitle}" u refuzua.`);
    toast(decision==='pranuar' ? 'Pranuar ✓' : 'Refuzuar');
  }catch(e){ toast('Gabim: '+e.message); }
}

async function checkIn(appId){
  const a = state.applications.find(x=>x.id===appId);
  if(!a || a.status!=='pranuar'){ toast('Ky turn nuk mund të fillojë tani'); return; }
  try{
    await updateDoc(doc(db,'applications',appId), {status:'ne_progres', checkedInAt: Date.now()});
    toast('Turni filloi 📍');
  }catch(e){ toast('Gabim: '+e.message); }
}

async function checkOut(appId){
  let earnings = 0, jobTitle = '', postedByUid = null, isSeed = false, workerName = '';
  try{
    await runTransaction(db, async (tx) => {
      const appRef = doc(db,'applications',appId);
      const appSnap = await tx.get(appRef);
      if(!appSnap.exists()) throw new Error('Aplikimi nuk u gjet');
      const appData = appSnap.data();
      if(appData.status !== 'ne_progres') throw new Error('Turni nuk është aktiv');
      workerName = appData.workerName || '';
      const jobRef = doc(db,'jobs', appData.jobId);
      const jobSnap = await tx.get(jobRef);
      const job = jobSnap.exists() ? jobSnap.data() : null;
      earnings = job ? (job.pay*job.hours) : 0;
      jobTitle = job ? job.title : '';
      postedByUid = job ? job.postedByUid : null;
      isSeed = job ? !!job.isSeed : false;
      tx.update(appRef, {status:'completed', checkedOutAt: Date.now()});
      tx.update(doc(db,'users',currentUid), { wallet: increment(earnings), completedShifts: increment(1) });
    });
    toast(`Turni përfundoi ✓ +${earnings} Lekë në portofol`);
    if(postedByUid && !isSeed){
      addNotifFor(postedByUid, `${workerName} përfundoi turnin "${jobTitle}".`);
    }
  }catch(e){ toast('Gabim: '+e.message); }
}

async function cancelApplication(appId){
  const a = state.applications.find(x=>x.id===appId);
  if(!a) return;
  const wasBooked = a.status==='pranuar' || a.status==='ne_progres';
  let jobTitle = '', postedByUid = null, isSeed = false;
  try{
    await runTransaction(db, async (tx) => {
      const appRef = doc(db,'applications',appId);
      const appSnap = await tx.get(appRef);
      if(!appSnap.exists()) return;
      const appData = appSnap.data();
      if(['anulluar','refuzuar','completed'].includes(appData.status)) return; // already final, nothing to do
      tx.update(appRef, {status:'anulluar'});
      if(wasBooked){
        const jobRef = doc(db,'jobs', a.jobId);
        const jobSnap = await tx.get(jobRef);
        if(jobSnap.exists()){
          const job = jobSnap.data();
          jobTitle = job.title; postedByUid = job.postedByUid; isSeed = !!job.isSeed;
          // clamp at 0 so an out-of-order race can never push the count negative
          tx.update(jobRef, { filled: Math.max(0, (job.filled||0) - 1) });
        }
        tx.update(doc(db,'users',currentUid), { cancellations: increment(1) });
      }
    });
    if(wasBooked){
      if(postedByUid && !isSeed) addNotifFor(postedByUid, `${a.workerName} anuloi turnin e rezervuar "${jobTitle}".`);
      toast('Aplikimi u anulua — kjo ul pikët e besueshmërisë');
    } else {
      toast('Aplikimi u anulua');
    }
  }catch(e){ toast('Gabim: '+e.message); }
}

async function withdrawWallet(){
  const p = state.profile;
  if(!(p.wallet>0)) return;
  const amt = p.wallet;
  try{
    await updateDoc(doc(db,'users',currentUid), {wallet:0});
    toast(`U tërhoqën ${amt} Lekë menjëherë (demo) 💸`);
  }catch(e){ toast('Gabim: '+e.message); }
}

async function rateBusiness(appId, stars){
  try{ await updateDoc(doc(db,'applications',appId), {workerRatingGiven:stars}); toast('Faleminderit për vlerësimin!'); }
  catch(e){ toast('Gabim: '+e.message); }
}
async function rateWorker(appId, stars){
  try{ await updateDoc(doc(db,'applications',appId), {businessRatingGiven:stars}); toast('Vlerësimi u ruajt'); }
  catch(e){ toast('Gabim: '+e.message); }
}

async function submitJob(){
  const title = document.getElementById('nj_title').value.trim();
  if(!title){ toast('Shkruaj titullin e punës'); return; }
  const p = state.profile;
  const job = {
    title,
    company: p.bizName || (p.firstName+' Biznes'),
    cat: document.getElementById('nj_cat').value,
    city: document.getElementById('nj_city').value,
    day: document.getElementById('nj_day').value,
    hours: Math.max(1, parseInt(document.getElementById('nj_hours').value,10) || 1),
    pay: Math.max(0, parseInt(document.getElementById('nj_pay').value,10) || 0),
    people: Math.max(1, parseInt(document.getElementById('nj_people').value,10) || 1),
    filled: 0,
    status: 'open',
    postedByUid: currentUid,
    postedByName: p.bizName || p.firstName,
    createdAt: Date.now()
  };
  try{
    const id = uid();
    await setDoc(doc(db,'jobs',id), job);
    toast('Puna u postua ✓');
    state.screen = 'home';
    render();
  }catch(e){ toast('Gabim: '+e.message); }
}

async function cancelJobPosting(jobId){
  const job = state.jobs.find(j=>j.id===jobId);
  if(!job || job.postedByUid !== currentUid) return;
  if(!confirm('Të mbyllet ky postim? Nuk do të shfaqet më te "Kërko".')) return;
  try{
    await updateDoc(doc(db,'jobs',jobId), {status:'closed'});
    toast('Postimi u mbyll');
  }catch(e){ toast('Gabim: '+e.message); }
}

function keepScroll(){
  const c = document.getElementById('content');
  state._scrollTop = c ? c.scrollTop : 0;
}
function renderKeepFocus(){
  keepScroll();
  render();
  const input = document.querySelector('.search input');
  if(input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

Object.assign(window, {
  chooseRole, backToRoleChoice, completeRegister, goLogin, doLogin, logout, forgotPassword,
  goto, onSearch, toggleLetter, setFilter, openJob, closeJob, handleFile,
  saveProfile, applyToJob, businessRespond, checkIn, checkOut, cancelApplication,
  withdrawWallet, rateBusiness, rateWorker, submitJob, cancelJobPosting, formatCardNum, formatExp,
  tokenizeCard, resetCard, render
});
