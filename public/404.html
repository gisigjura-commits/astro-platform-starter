<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faqja nuk u gjet — DayJob</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{ --ink:#0B0F1A; --ink-2:#131A2E; --text:#F3F5FA; --text-mute:#7C87A8; --amber:#FFB800; --amber-2:#FF7A1A; }
  html,body{ margin:0; height:100%; }
  body{
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:var(--text); font-family:system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .mark{ font-size:56px; margin-bottom:6px; }
  h1{ font-size:22px; margin:8px 0 6px; background:linear-gradient(135deg,var(--amber),var(--amber-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p{ color:var(--text-mute); font-size:14px; margin:0 0 18px; }
  a{ color:var(--amber); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div>
    <div class="mark">🔎</div>
    <h1>404 — Faqja nuk u gjet</h1>
    <p>Kjo faqe nuk ekziston ose është zhvendosur.</p>
    <a href="/">← Kthehu te DayJob</a>
  </div>
</body>
</html>
